name: KiteSim

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"

packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.24.2

targets:
  KiteSim:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/KiteSim
        excludes:
          - Resources
      # .onnx / .json 显式进 resources 阶段，避免未知扩展名被忽略
      - path: Sources/KiteSim/Resources
        buildPhase: resources
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: KiteSim
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        # 图标来自 Assets.xcassets/AppIcon（矢量路径复用安卓 adaptive icon）
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kitesim.auto.ios
        PRODUCT_NAME: KiteSim
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

schemes:
  KiteSim:
    build:
      targets:
        KiteSim: all
    run:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: false
